name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests examples/art-pilot/tests
      - run: python -m build
      - name: Smoke-test installed wheel and schema resources
        run: |
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, 'examples/art-pilot/scripts/smoke_wheel.py', '--wheel', str(wheel)])"
      - name: Check source and wheel distribution boundaries
        run: |
          python -c "import pathlib, tarfile, zipfile; source = next(pathlib.Path('dist').glob('*.tar.gz')); wheel = next(pathlib.Path('dist').glob('*.whl')); s = tarfile.open(source); names = [n.split('/', 1)[-1] for n in s.getnames() if s.getmember(n).isfile()]; pilot = [n for n in names if n.startswith('examples/art-pilot/')]; assert pilot; assert all(n.startswith(('examples/art-pilot/scripts/', 'examples/art-pilot/tests/')) or n == 'examples/art-pilot/README.md' for n in pilot), pilot; assert not any(n.endswith(('.png', '.bin', '.pyc')) for n in pilot); assert 'examples/art-pilot/scripts/smoke_wheel.py' in pilot; assert not any('art-pilot' in n for n in zipfile.ZipFile(wheel).namelist())"

  licensing:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - run: python -m pip install "reuse>=5,<7"
      - run: reuse lint
